<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Login</title>
        <script type="text/javascript" src="login.js"></script>
        
        <style>
            /* 1. กำหนดให้ body ขยายเต็มหน้าจอ และจัดการจัดวางด้วย Flexbox */
            body {
                margin: 0;
                padding: 0;
                min-height: 100vh;           /* ความสูงเต็มหน้าจอ */
                background-color: #f0f2f5;   /* ใส่สีพื้นหลังตรงนี้ (เปลี่ยนรหัสสีได้) */
                
                display: flex;
                flex-direction: column;      /* เรียงองค์ประกอบลงมาตามแนวตั้ง */
                justify-content: center;     /* จัดให้อยู่กลางแนวตั้ง */
                align-items: center;         /* จัดให้อยู่กลางแนวนอน */
                font-family: sans-serif;
            }

            /* 2. แต่งตัวฟอร์มให้อยู่ในกล่องสีขาวดูสะอาดตา */
            #myLogin {
                background-color: #ffffff;   /* สีพื้นหลังของกล่องฟอร์ม */
                padding: 20px;
                border-radius: 8px;          /* ปรับมุมโค้ง */
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* ใส่เงาเบาๆ */
                width: 300px;                /* กำหนดความกว้างกล่อง */
            }


            legend {
                font-weight: bold;
                padding: 0 5px;
            }

            input[type="text"],
            input[type="password"] {
                width: 90%;
                padding: 8px;
                margin-top: 5px;
                margin-bottom: 10px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            /* 3. จัดสไตล์ข้อความด้านล่างฟอร์ม */
            p {
                margin-top: 15px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <form name="myLogin" id="myLogin">
            <fieldset>
                <legend>Login</legend>
                Username: 
                <input type="text" name="username" id="username" required>
                <br>
                
                Password: 
                <input type="password" name="password" required>
                <br><br>
                
                <input type="submit" value="Login" id="loginBtn">
                <input type="reset" value="Clear" id="clearBtn">
            </fieldset>
        </form>
        
        <p>ยังไม่มีบัญชีใช่ไหม? <a href="register.html">ลงทะเบียนที่นี่</a></p>
    </body>
</html>
